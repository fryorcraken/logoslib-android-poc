org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# ABIs packaged into the APKs. Only ABIs that scripts/android/stage.sh has staged
# into logos-core/src/main/jniLibs/<abi> end up with native code; x86_64 is the
# emulator target, arm64-v8a is ready but not built yet. Override per build with
# ./gradlew -Plogos.abis=x86_64,arm64-v8a ...
logos.abis=x86_64
